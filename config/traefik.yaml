global:
  checkNewVersion: false
  sendAnonymousUsage: false
  # Rejette les variantes X_Auth_User / X.Auth.User que Nginx pourrait
  # normaliser comme X-Auth-User et qui permettraient une usurpation d'en-tête.
  aliasHeadersStrategy: reject

log:
  level: INFO

accessLog: {}

# api.insecure est toléré uniquement dans ce laboratoire : port hôte 8080 sur
# 127.0.0.1. En production, le désactiver et router api@internal derrière
# TLS + authentification forte + VPN / liste d'IP autorisées.
api:
  dashboard: true
  insecure: true

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: frontend
    watch: true
  file:
    directory: /etc/traefik/dynamic
    watch: true
